# =======================================================================================================================================
# tracking_params.yaml
# =======================================================================================================================================
# object_tracking / tracking_node parameters.
#
# 구독 토픽 : input_topic / 발행 토픽 : output_topic / 받아올 type : track_type
# 발행 주기 / 컨베이어벨트 속도 / 컨베이어벨트 불확실변수(진동 등으로 느려질 경우)
# 측정 노이즈 : meas_pos_std / 갑자기 확 튀는 노이즈 버림 : gate_chi2
# 카메라가 중간에 뚝뚝 끊겨도 시간 간격을 정해두어 dt(다음위치 계산할 때 쓰는 시간간격)가 이상해지는 것을 막음.
# 필터 켜고 난 이후 5번은 검사 끄기. 초기엔 정상값도 버릴 수 있음.
# 로봇 팔이 상자를 가려 측정이 끊겼을 때, 1초까지는 관성으로 예측하고 그 이상이면 "놓쳤다"고 판단해 발행 중단
# 카메라가 찍은 순간부터 우리가 받기까지 걸리는 지연 (보정용) / 지금부터 0.5초뒤 위치 예측 / 추정 속도가 2 mm/s 미만이면 "안 움직인다"고 보고 현재 위치 그대로 사용
# =======================================================================================================================================

tracking_node:
  ros__parameters:

    # --- I/O ---
    input_topic: /vision/detected_object
    output_topic: /tracking/predicted_target
    track_type: "target"          # DetectedObject.type 필터

    # --- loop ---
    update_rate_hz: 50.0          # 타이머 predict/publish 주기
    prediction_time: 0.0          # x,y,z 를 몇 초 뒤로 실을지 [s]. 0.0=현재위치(권장).
                                  # 미래 외삽은 구독 측이 vx,vy,vz 로 직접 수행

    # --- Kalman filter (M2~) ---
    belt_speed: 50.0             # mm/s, 알려진 컨베이어 속도 (초기화·검증)
    process_accel_std: 20.0      # mm/s^2, 등속이라 작게
    meas_pos_std: [3.0, 3.0, 8.0]  # mm, (x, y, z). z 크게. M6에서 실측
    gate_chi2: 7.815            # chi-square 95%, dof=3 (NIS(측정이 예상범위 안이면 1점) 게이트)
    dt_min: 0.005               # 최소 시간간격 범위
    dt_max: 0.15                # 최대 시간간격 범위
    warmup_updates: 20           # 초기 N회는 게이트 비활성화

    # 출력 PredictedTarget: noise 없는 (x,y,z) + 칼만 상태 속도 (vx,vy,vz).
    # 상자가 가려져도 등속 예측으로 계속 발행 (중단 없음).
    # 로봇 컨트롤은 이 메시지만으로 target_manager 역할(위치/속도/미래예측)을 전부 수행한다.
